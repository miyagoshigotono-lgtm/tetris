<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ブロックおとし">
<title>ブロックおとし</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<main id="stage">
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="hud">
      <button class="mc-btn small" data-act="pause" aria-label="ポーズ"><img data-icon="pause" alt=""></button>
      <button class="mc-btn small" data-act="sound" aria-label="おと"><img id="soundIcon" alt=""></button>
      <button class="mc-btn small" id="musicBtn" data-act="music" aria-label="おんがく"><img data-icon="music" alt=""></button>
    </div>
  </div>
</main>

<nav id="controls">
  <button class="mc-btn" data-act="left" style="grid-area: left" aria-label="ひだり"><img data-icon="left" alt=""></button>
  <button class="mc-btn" data-act="right" style="grid-area: right" aria-label="みぎ"><img data-icon="right" alt=""></button>
  <button class="mc-btn" data-act="down" style="grid-area: down" aria-label="した"><img data-icon="down" alt=""></button>
  <button class="mc-btn" id="flint" data-act="flint" style="grid-area: flint" aria-label="ひうちいし">
    <img data-icon="flint" alt=""><span class="badge" hidden></span>
  </button>
  <button class="mc-btn" data-act="rotate" style="grid-area: rot" aria-label="かいてん"><img data-icon="rotate" alt=""></button>
  <button class="mc-btn" data-act="drop" style="grid-area: drop" aria-label="おとす"><img data-icon="drop" alt=""></button>
</nav>

<section id="title" class="overlay">
  <h1 class="logo">ブロック<br>おとし</h1>
  <div id="blockRow" class="block-row"></div>
  <button class="mc-btn wide" data-ui="start" aria-label="スタート"><img data-icon="play" alt=""></button>
  <div class="score-row"><img data-icon="crown" alt="" class="crown"><span id="titleBest"></span></div>
  <div id="ver" class="ver"></div>
</section>

<section id="pause" class="overlay" hidden>
  <button class="mc-btn wide" data-ui="resume" aria-label="つづける"><img data-icon="play" alt=""></button>
  <button class="mc-btn wide" data-ui="restart" aria-label="さいしょから"><img data-icon="retry" alt=""></button>
</section>

<section id="over" class="overlay" hidden>
  <div class="over-title">ゲームオーバー</div>
  <div class="score-row big"><img data-icon="emerald" alt=""><span id="overScore"></span></div>
  <div id="newBest" class="new-best" hidden>NEW!</div>
  <div class="score-row"><img data-icon="crown" alt="" class="crown"><span id="overBest"></span></div>
  <button class="mc-btn wide" data-ui="start" aria-label="もういちど"><img data-icon="retry" alt=""></button>
</section>
</body>
</html>
